<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoE Tools · 精华收益计算器</title>
<meta name="description" content="PoE Tools 中文精华转换收益计算器">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#222;font-family:Arial,"Microsoft YaHei",sans-serif}body{min-width:320px}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:68px;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.nav{display:flex;align-items:center;gap:8px}.brand{font-size:36px;font-weight:800;letter-spacing:-2px;margin-right:18px}.nav-button{width:42px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:#aaa}.nav-button:hover,.nav-button.active{background:#303033;color:#fff}.nav-button img{width:25px;height:25px;object-fit:contain}.faq{color:#ddd;font-size:14px}.main{max-width:1180px;margin:auto;padding:48px 24px 70px}.intro{font-size:16px;line-height:1.75;margin-bottom:42px}.intro p{margin:0 0 8px}.controls{width:760px;max-width:100%;margin:auto;display:flex;flex-direction:column;gap:20px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.label{font-size:18px;margin-right:4px}.plain,.currency button,.checks button{border:0;background:transparent;padding:5px 9px;color:#222}.plain:hover,.currency button:hover,.checks button:hover{background:#f0f0f0;border-radius:4px}.chosen{background:#eee!important;border-radius:4px}.icon16{width:16px;height:16px;object-fit:contain;vertical-align:middle}.icon20{width:20px;height:20px;object-fit:contain;vertical-align:middle}.rate{display:flex;align-items:center;gap:5px;margin-left:10px}.number{width:75px;height:29px;padding:3px 7px;border:1px solid #aaa;border-radius:2px;background:#fff}.checks{margin-top:11px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}.generate{margin-top:7px;width:52%;min-width:220px;padding:6px 12px;border:0;border-radius:3px;background:#222;color:#fff;font-size:21px}.generate:hover{background:#444}.items{width:760px;max-width:100%;margin:34px auto 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.item{border:1px solid #ddd;border-radius:6px;padding:10px;display:flex;gap:9px;min-height:112px}.item:hover{border-color:#999}.item-main{width:58px;flex:none;text-align:center;overflow:hidden}.item-main img{width:40px;height:40px;object-fit:contain}.item-name{font-size:12px;margin-top:4px;white-space:nowrap}.item-en{font-size:9px;color:#999;white-space:nowrap}.item-fields{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}.field-row{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;color:#555;min-height:28px}.field-row input{width:62px;height:25px;border:1px solid #aaa;border-radius:2px;padding:2px 4px}.gen-check{width:24px;display:flex;align-items:center;justify-content:center}.gen-check input{width:17px;height:17px}.section{width:760px;max-width:100%;margin:48px auto 0}.section-title{text-align:center;font-size:22px;font-weight:500;margin:0 0 18px}.strategy-title{font-size:14px;margin-bottom:7px}.help{display:inline-flex;width:21px;height:21px;border:1px solid #60a5fa;border-radius:50%;align-items:center;justify-content:center;color:#3b82f6}.strategy{display:inline-flex;border:1px solid #555;border-radius:4px;overflow:hidden}.strategy button{border:0;background:#fff;color:#777;padding:6px 14px}.strategy button+button{border-left:1px solid #555}.strategy button.active{background:#555;color:#fff}.cheat-line{display:flex;align-items:flex-start;margin-top:28px}.tag{width:72px;flex:none;margin-top:8px;font-size:21px}.keep{color:#45a900}.flip{color:#771111}.chips{display:flex;flex-wrap:wrap;gap:12px 10px}.chip{position:relative;width:42px;text-align:center;font-size:10px}.chip img{width:36px;height:36px;object-fit:contain}.chip .value{position:absolute;right:-7px;top:26px;background:#fff;padding:0 2px}.pos{color:#3a9e00}.neg{color:#e11}.results{width:760px;max-width:100%;margin:48px auto 0}.results-block{font-size:17px;line-height:1.85;margin-bottom:18px}.results-block h2{font-size:20px;font-weight:500;margin:5px 0}.result-line{display:flex;align-items:center;min-height:31px}.result-label{width:205px}.result-num{width:70px;text-align:right;font-weight:700;margin-right:6px}.roi{font-size:19px;font-weight:700}.footer{height:42px;background:#18181b;color:#ccc;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px}.footer a:hover{text-decoration:underline}@media(max-width:800px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:30px 18px 55px}}@media(max-width:560px){.top{height:58px;padding:0 10px}.brand{font-size:29px;margin-right:4px}.nav{gap:2px}.nav-button{width:35px;height:36px}.nav-button:nth-of-type(n+6){display:none}.faq{font-size:11px}.main{padding:24px 13px 45px}.intro{font-size:14px;margin-bottom:28px}.label{font-size:17px}.generate{width:100%}.items{grid-template-columns:1fr}.section,.results{width:100%}.tag{width:65px}.footer{font-size:10px}.footer span{display:none}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><a class="brand" href="./">GoE</a><a class="nav-button active" href="#essences"><img src="https://gains-of-exile.vercel.app/images/essences/deafening-greed.png" alt="精华"></a><a class="nav-button" href="#"><img src="https://gains-of-exile.vercel.app/images/essences/corrupt-insanity.png" alt="腐化精华"></a><a class="nav-button" href="#"><img src="https://gains-of-exile.vercel.app/images/fossils/serrated.png" alt="化石"></a><a class="nav-button" href="#"><img src="https://gains-of-exile.vercel.app/images/catalysts/noxious.png" alt="催化剂"></a><a class="nav-button" href="#"><img src="https://gains-of-exile.vercel.app/images/oils/azure.png" alt="精油"></a></nav><a class="faq" href="#">📜 帮助 / FAQ</a></header>
<main class="main" id="essences"><section class="intro"><p>欢迎，流放者。这里是 <b>PoE Tools 中文版</b> 的精华转换收益计算器。</p><p>输入当前精华价格与汇率，页面会自动计算翻转方向、转换成本、预期出售价值、利润和投资回报率。</p></section>
<section class="controls"><div class="row currency"><span class="label">货币：</span><button class="chosen"><img class="icon16" src="https://gains-of-exile.vercel.app/images/chaos.png" alt="混沌石"></button><button><span style="font-size:20px"><sup>1</sup>/<sub><img class="icon16" src="https://gains-of-exile.vercel.app/images/divine.png" alt="神圣石"></sub></span></button><span class="rate"><input id="rate" class="number" type="number" value="150" min="1" step="0.5"> × <img class="icon20" src="https://gains-of-exile.vercel.app/images/chaos.png"> = <img class="icon20" src="https://gains-of-exile.vercel.app/images/divine.png"></span></div>
<div><div class="row"><span class="label">物品价格：</span><button class="plain" onclick="zeroPrices()">设为 0</button><button class="plain" onclick="loadDemo()">载入示例</button><button class="plain" onclick="savePrices()">保存</button></div></div>
<div><div class="row"><span class="label">数量生成：</span><span>介于</span><input id="minQty" class="number" value="50" type="number" min="0"><span>和</span><input id="maxQty" class="number" value="500" type="number" min="1"><span>之间</span></div><div class="checks"><span class="label">复选框：</span><button onclick="setAll(true)">全部</button><button onclick="setAll(false)">无</button><button onclick="setGood()">高收益 ↗</button><button onclick="setBad()">低收益 ↘</button></div><button class="generate" onclick="generateQuantities()">← 生成 →</button></div></section>
<section class="items" id="items"></section>
<section class="section"><h1 class="section-title">翻转速查表</h1><div class="strategy-title">策略 <span class="help">?</span></div><div class="strategy"><button id="oneStep" class="active" onclick="setStrategy('one')">一步转换</button><button id="optimal" onclick="setStrategy('optimal')">最优路线</button></div><div class="cheat-line"><span class="tag keep">保留：</span><div class="chips" id="keep"></div></div><div class="cheat-line"><span class="tag flip">翻转：</span><div class="chips" id="flip"></div></div></section>
<section class="results"><h1 class="section-title">结果</h1><div class="results-block"><div>预计翻转次数：<b id="flipCount">0</b> <img class="icon16" src="https://gains-of-exile.vercel.app/images/flip2.png"></div><div>预计需要生命力：<b id="lifeForce">0</b> <img class="icon16" src="https://gains-of-exile.vercel.app/images/lifeforces/primal.png"></div></div><div class="results-block"><h2>成本与收益</h2><div class="result-line"><span class="result-label">不进行翻转：</span><b id="baseCost" class="result-num">0</b> <img class="icon16" src="https://gains-of-exile.vercel.app/images/chaos.png"></div><div class="result-line"><span class="result-label">购买生命力：</span><b id="lifeCost" class="result-num">0</b> <img class="icon16" src="https://gains-of-exile.vercel.app/images/chaos.png"></div><div class="result-line"><span class="result-label">出售转换物：</span><b id="sellValue" class="result-num">0</b> <img class="icon16" src="https://gains-of-exile.vercel.app/images/chaos.png"></div></div><div class="results-block"><h2>预计利润</h2><div class="result-line"><span class="result-label">总计：</span><b id="profit" class="result-num">0</b> <img class="icon16" src="https://gains-of-exile.vercel.app/images/chaos.png"></div><div class="roi">投资回报率：<span id="roi">0.00%</span></div></div></section></main>
<footer class="footer"><a href="#">🩸 反馈</a><span>PoE Tools · 中文版 · 非 Grinding Gear Games 官方项目</span><a href="#">☕ 支持开发</a></footer>
<script>
const DATA=[['dread','恐惧','Dread',8],['misery','悲惨','Misery',8],['envy','忌妒','Envy',7],['scorn','鄙夷','Scorn',6],['spite','轻蔑','Spite',6],['anguish','痛苦','Anguish',5],['zeal','狂热','Zeal',10],['loathing','憎恨','Loathing',8],['doubt','怀疑','Doubt',5],['wrath','愤怒','Wrath',5],['suffering','苦难','Suffering',4],['rage','暴怒','Rage',5],['sorrow','悲伤','Sorrow',5],['torment','折磨','Torment',5],['anger','愤怒','Anger',4],['fear','恐惧','Fear',6],['greed','贪婪','Greed',5],['hatred','憎恨','Hatred',5],['worry','忧虑','Worry',4],['contempt','轻视','Contempt',4]];
const ICON='https://gains-of-exile.vercel.app/images/essences/deafening-';
let prices=JSON.parse(localStorage.getItem('poeToolsEssencePrices')||'null')||Object.fromEntries(DATA.map(x=>[x[0],x[3]]));let checked=new Set(DATA.map(x=>x[0]));let strategy='one';
function money(v){return Number(v||0).toFixed(2)}
function imgFor(id){return ICON+id+'.png'}
function getRate(){return Math.max(1,Number(document.getElementById('rate').value)||150)}
function render(){const rate=getRate();const items=document.getElementById('items');items.innerHTML='';const values=DATA.map(x=>({id:x[0],cn:x[1],en:x[2],price:Number(prices[x[0]])||0,base:x[3]}));const avg=values.reduce((s,x)=>s+(x.price?1/x.price:0),0)/values.length;values.forEach(x=>{const other=values.filter(y=>y.id!==x.id);const otherAvg=other.reduce((s,y)=>s+(y.price?1/y.price:0),0)/other.length;const profit=otherAvg-(x.price?1/x.price:0)-30/rate;const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="item-main"><img src="${imgFor(x.id)}" alt="${x.cn}" onerror="this.style.opacity='.25'"><div class="item-name">${x.cn}</div><div class="item-en">${x.en}</div></div><div class="item-fields"><div class="field-row"><span>价格 / 神圣石</span><input type="number" min="0" step="1" value="${x.price}" data-id="${x.id}"></div><div class="field-row"><span>转换收益</span><b class="${profit>=0?'pos':'neg'}">${money(profit)}</b></div><div class="field-row"><span>生成</span><label class="gen-check"><input type="checkbox" data-check="${x.id}" ${checked.has(x.id)?'checked':''}></label></div></div>`;items.appendChild(el)});items.querySelectorAll('input[type=number]').forEach(i=>i.addEventListener('input',e=>{prices[e.target.dataset.id]=Number(e.target.value)||0;localStorage.setItem('poeToolsEssencePrices',JSON.stringify(prices));renderResults()}));items.querySelectorAll('input[data-check]').forEach(i=>i.addEventListener('change',e=>{e.target.checked?checked.add(e.target.dataset.check):checked.delete(e.target.dataset.check);updateFlip()}));updateFlip();renderResults()}
function updateFlip(){const keep=document.getElementById('keep'),flip=document.getElementById('flip');keep.innerHTML='';flip.innerHTML='';const vals=DATA.map(x=>({id:x[0],cn:x[1],p:Number(prices[x[0]])||0}));vals.sort((a,b)=>b.p-a.p);const best=vals[0]?.p||0;vals.forEach(x=>{const c=document.createElement('div');c.className='chip';c.innerHTML=`<img src="${imgFor(x.id)}" alt="${x.cn}" onerror="this.style.opacity='.25'"><span>${x.cn}</span><span class="value ${x.p>=best*.9?'pos':'neg'}">${x.p}</span>`;(x.p>=best*.9?keep:flip).appendChild(c)})}
function renderResults(){const rate=getRate();let total=0;checked.forEach(id=>{total+=Number(prices[id])||0});const count=checked.size;const life=count*30;const lifeCost=life/rate;const baseCost=total;const sell=total+Math.max(0,count*2);const profit=sell-baseCost-lifeCost;document.getElementById('flipCount').textContent=count;document.getElementById('lifeForce').textContent=life;document.getElementById('baseCost').textContent=money(baseCost);document.getElementById('lifeCost').textContent=money(lifeCost);document.getElementById('sellValue').textContent=money(sell);document.getElementById('profit').textContent=money(profit);document.getElementById('roi').textContent=(baseCost+lifeCost>0?(profit/(baseCost+lifeCost)*100):0).toFixed(2)+'%'}
function setAll(v){checked=new Set(v?DATA.map(x=>x[0]):[]);render()}
function setGood(){const vals=DATA.map(x=>({id:x[0],p:Number(prices[x[0]])||0}));const avg=vals.reduce((s,x)=>s+x.p,0)/vals.length;checked=new Set(vals.filter(x=>x.p>=avg).map(x=>x.id));render()}
function setBad(){const vals=DATA.map(x=>({id:x[0],p:Number(prices[x[0]])||0}));const avg=vals.reduce((s,x)=>s+x.p,0)/vals.length;checked=new Set(vals.filter(x=>x.p<avg).map(x=>x.id));render()}
function zeroPrices(){DATA.forEach(x=>prices[x[0]]=0);localStorage.setItem('poeToolsEssencePrices',JSON.stringify(prices));render()}
function loadDemo(){DATA.forEach((x,i)=>prices[x[0]]=x[3]+(i%5));localStorage.setItem('poeToolsEssencePrices',JSON.stringify(prices));render()}
function savePrices(){localStorage.setItem('poeToolsEssencePrices',JSON.stringify(prices));alert('价格已保存到本机。')}
function generateQuantities(){let min=Math.max(0,Number(document.getElementById('minQty').value)||0),max=Math.max(min,Number(document.getElementById('maxQty').value)||min);checked.forEach(id=>{const n=Math.floor(Math.random()*(max-min+1))+min;const input=document.querySelector(`input[data-id="${id}"]`);if(input)input.value=n;prices[id]=n});localStorage.setItem('poeToolsEssencePrices',JSON.stringify(prices));render()}
function setStrategy(s){strategy=s;document.getElementById('oneStep').classList.toggle('active',s==='one');document.getElementById('optimal').classList.toggle('active',s==='optimal');updateFlip()}
document.getElementById('rate').addEventListener('input',render);render();
</script></body></html>
